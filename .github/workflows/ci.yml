name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi clang-tidy cppcheck
        
    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake
        cmake --build build
    
    - name: Quality Gates - Lint (Clang-Tidy)
      run: |
        # Vérification des inclusions HAL interdites (sauf dans HardwareAccessLayer)
        ! grep -r "stm32f4xx_hal.h" Modules/ --exclude-dir=HardwareAccessLayer
        
    - name: Quality Gates - Memory Check
      run: |
        python3 _bmad/scripts/check_memory.py build/KhaNeSystem.map
        
    - name: Quality Gates - Dynamic Memory Audit
      run: |
        ! grep -rE "malloc|free|calloc|realloc" Core/ Modules/ Libs/ --exclude=*.md
        
    - name: Quality Gates - Simulation SIL
      run: |
        ./build/tests/e2e/sil_sim --headless --duration 10s
